name: Build StitkyTisk.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean StitkyTisk.spec

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: StitkyTisk-windows
          path: dist/StitkyTisk.exe
          if-no-files-found: error
